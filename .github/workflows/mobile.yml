name: Mobile CI

on:
  push:
    paths:
      - "packages/mobile/**"
      - "packages/web/**"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "packages/mobile/**"
      - "packages/web/**"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/mobile.yml"

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - run: bun install --frozen-lockfile
      - run: bun --cwd packages/mobile typecheck
      - run: bun --cwd packages/mobile test lib/api.test.ts
      - run: bun test packages/web/src/api/lib/football-production-engine.test.ts
